<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#00160D" />
    <meta name="description" content="Digital Tasbeeh Counter - A beautiful fullscreen Islamic prayer bead counter with sound effects and haptic feedback" />
    <title>Digital Tasbeeh Counter</title>
    <style>
      /* Critical CSS - applied immediately to prevent flash */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        background-color: #00160D !important;
        color: #ffffff;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      }
      /* Safe area padding for notched devices */
      @supports (padding: env(safe-area-inset-top)) {
        body {
          padding-top: env(safe-area-inset-top);
          padding-left: env(safe-area-inset-left);
          padding-right: env(safe-area-inset-right);
          padding-bottom: env(safe-area-inset-bottom);
        }
      }
    </style>
    <script>
      // Set dark theme immediately to avoid flash
      (function () {
        document.documentElement.classList.remove("light");
        document.documentElement.classList.add("dark");
        document.documentElement.setAttribute("data-theme", "dark");
      })();
    </script>
    <script>
      (function () {
        if (window.self === window.top) return;
        var reported = {};
        window.addEventListener("error", function (event) {
          if (!event || !event.message) return;
          var key =
            event.message + "|" + (event.filename || "") + "|" + (event.lineno || 0);
          if (reported[key]) return;
          reported[key] = true;
          try {
            window.parent.postMessage(
              {
                type: "sandbox-runtime-error",
                payload: {
                  message: String(event.message).slice(0, 500),
                  filename: event.filename || "",
                  lineno: event.lineno || 0,
                  colno: event.colno || 0,
                  stack:
                    event.error && event.error.stack
                      ? String(event.error.stack).slice(0, 2000)
                      : ""
                }
              },
              "*"
            );
          } catch (e) {}
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
