<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#00160D" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f0f7f4" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Digital Tasbeeh Counter - Beautiful Islamic prayer bead counter with multiple sound effects, haptic feedback, and dark/light themes" />
    <title>Digital Tasbeeh Counter</title>
    <style>
      /* Critical CSS - prevents flash of unstyled content */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* Dark theme default */
      html[data-theme="dark"], html:not([data-theme]) {
        background-color: #00160D;
        color: #ffffff;
      }
      /* Light theme */
      html[data-theme="light"] {
        background-color: #f0f7f4;
        color: #1a1a1a;
      }
      /* Safe area support */
      @supports (padding: env(safe-area-inset-top)) {
        body {
          padding-top: env(safe-area-inset-top);
          padding-bottom: env(safe-area-inset-bottom);
          padding-left: env(safe-area-inset-left);
          padding-right: env(safe-area-inset-right);
        }
      }
    </style>
    <script>
      // Initialize theme immediately to prevent flash
      (function () {
        var saved = localStorage.getItem('tasbeeh-theme');
        var theme = saved === 'light' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.classList.remove('light', 'dark');
        document.documentElement.classList.add(theme);
      })();
    </script>
    <script>
      (function () {
        if (window.self === window.top) return;
        var reported = {};
        window.addEventListener("error", function (event) {
          if (!event || !event.message) return;
          var key = event.message + "|" + (event.filename || "") + "|" + (event.lineno || 0);
          if (reported[key]) return;
          reported[key] = true;
          try {
            window.parent.postMessage({
              type: "sandbox-runtime-error",
              payload: {
                message: String(event.message).slice(0, 500),
                filename: event.filename || "",
                lineno: event.lineno || 0,
                colno: event.colno || 0,
                stack: event.error && event.error.stack ? String(event.error.stack).slice(0, 2000) : ""
              }
            }, "*");
          } catch (e) {}
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
