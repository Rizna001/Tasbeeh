<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover, shrink-to-fit=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#00160D" />
    <meta name="description" content="Digital Tasbeeh Counter - Multi-language Islamic prayer bead counter with Uthmani Arabic script, themes, sound effects, and haptic feedback." />
    <title>Digital Tasbeeh Counter</title>
    <!-- Preconnect for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Amiri font for Uthmani Arabic script -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        touch-action: manipulation;
      }
      html[data-theme="dark"], html:not([data-theme]) {
        background-color: #00160D;
        color: #ffffff;
      }
      html[data-theme="light"] {
        background-color: #f4faf7;
        color: #1a2e1a;
      }
      html[data-theme="sepia"] {
        background-color: #2b1d0e;
        color: #f5e6d3;
      }
      @supports (padding: env(safe-area-inset-top)) {
        body {
          padding-top: env(safe-area-inset-top);
          padding-bottom: env(safe-area-inset-bottom);
          padding-left: env(safe-area-inset-left);
          padding-right: env(safe-area-inset-right);
        }
      }
      body {
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }
    </style>
    <script>
      (function () {
        var saved = localStorage.getItem('tasbeeh-theme');
        var theme = (saved === 'light' || saved === 'sepia') ? saved : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        
        function notifyFlutter() {
          var msg = JSON.stringify({ type: 'pageReady', theme: theme, timestamp: Date.now() });
          try { if (window.FlutterWebView) window.FlutterWebView.postMessage(msg); } catch(e){}
          try { if (window.flutter_inappwebview) window.flutter_inappwebview.callHandler('TasbeehEvent', msg); } catch(e){}
          try { if (window._FlutterWebViewBridge) window._FlutterWebViewBridge(msg); } catch(e){}
        }
        
        if (document.readyState === 'complete') notifyFlutter();
        else window.addEventListener('load', notifyFlutter);
      })();
    </script>
    <script>
      (function () {
        if (window.self === window.top) return;
        var reported = {};
        window.addEventListener("error", function (event) {
          if (!event || !event.message) return;
          var key = event.message + "|" + (event.filename || "") + "|" + (event.lineno || 0);
          if (reported[key]) return;
          reported[key] = true;
          try {
            window.parent.postMessage({
              type: "sandbox-runtime-error",
              payload: {
                message: String(event.message).slice(0, 500),
                filename: event.filename || "",
                lineno: event.lineno || 0,
                colno: event.colno || 0,
                stack: event.error && event.error.stack ? String(event.error.stack).slice(0, 2000) : ""
              }
            }, "*");
          } catch (e) {}
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
